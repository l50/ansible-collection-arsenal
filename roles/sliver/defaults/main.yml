---
sliver_cleanup: false  # Enable for Docker/container builds to minimize image size
sliver_install_path: /opt/sliver
sliver_setup_systemd: false
sliver_unpack_at_build: true # Disable to skip unpacking at build time for Docker/container builds

# Retry behavior for the sliver compile step. The build fetches toolchain
# artifacts (e.g. garble, zig) from upstream mirrors that intermittently return
# gateway timeouts or fail signature verification on CI runners, so the compile
# is retried with a delay before failing the run.
sliver_build_retries: 2
sliver_build_delay: 30

sliver_username: "sliver"
sliver_usergroup: "sliver"
sliver_shell: "{% if ansible_facts['os_family'] == 'Darwin' %}/bin/zsh{% else %}/bin/bash{% endif %}"
sliver_mise_plugins:
  # renovate: datasource=github-tags depName=golang packageName=golang/go extractVersion=^go(?<version>.*)$
  - name: go
    version: "1.27.3"
    scope: "global"
