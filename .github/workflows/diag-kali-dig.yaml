---
name: Diag Kali dig
on:
  push:
    branches:
      - fm/arsenal-recon-dig
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Allow Kali OpenSSL config in host dig AppArmor profile
        shell: bash
        run: |
          if [[ -f /etc/apparmor.d/dig ]]; then
            sudo mkdir -p /etc/apparmor.d/local
            echo '/etc/ssl/kali.cnf r,' | sudo tee -a /etc/apparmor.d/local/dig
            sudo apparmor_parser -r /etc/apparmor.d/dig
          fi
      - name: Privileged Kali container
        run: |
          docker run --rm --privileged cisagov/docker-kali-ansible:latest bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null; apt-get install -y -qq dnsutils >/dev/null 2>&1
            dig -v; echo "priv rc=$?"
          ' || true
          sudo dmesg | grep -i apparmor | grep -i dig | tail -5 || true
